name: Lint Check

permissions:
  contents: read

on:
  pull_request:
    branches:
      - "**"

jobs:
  lint:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Node.js
        uses: actions/setup-node@v3
        with:
          node-version: "lts/*"

      - name: Install dependencies
        run: npm ci

      - name: Run lint
        run: npm run lint

      - name: Verify TypeScript 7 compiler
        run: |
          compiler_version="$(npx --no-install tsc --version)"
          echo "$compiler_version"
          [[ "$compiler_version" == "Version 7."* ]]
